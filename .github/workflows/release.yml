name: Build AppImage and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine playwright "mcp<2" httpx pillow

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --name "m365-linux-bridge" \
                      --onefile \
                      --windowed \
                      --add-data "icons/m365.png:icons" \
                      --collect-all PyQt6_WebEngine \
                      --collect-all playwright \
                      m365_bridge/gui.py

      - name: Prepare AppDir for AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps
          mkdir -p AppDir/usr/share/applications

          cp dist/m365-linux-bridge AppDir/usr/bin/
          cp icons/m365.png AppDir/usr/share/icons/hicolor/64x64/apps/m365.png
          cp icons/m365.png AppDir/m365.png

          cat << 'EOF' > AppDir/m365-linux-bridge.desktop
          [Desktop Entry]
          Type=Application
          Name=M365 Linux Bridge
          Comment=Microsoft 365 Client & MCP Server for Linux
          Exec=m365-linux-bridge
          Icon=m365
          Categories=Office;Network;Email;
          EOF

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/m365-linux-bridge" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package into AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir M365-Linux-Bridge-x86_64.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: M365-Linux-Bridge-x86_64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
